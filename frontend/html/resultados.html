<h2>Resultados de Aprendizaje
	<a href="https://github.com/mjaque/ccxi/blob/main/docs/7_resultados.md" target=_blank class=icono-info>
		<svg viewBox="0 0 24 24" width="20" height="20">
			<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
			<line x1="12" y1="10" x2="12" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
			<line x1="12" y1="7" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
		</svg>
	</a>
</h2>

<div class=formulario>
	<input type=hidden id=resultado-id>

	<label for=resultado-codigo>Código</label>
	<input type=text id=resultado-codigo maxlength=50 required>

	<label for=resultado-nombre>Nombre</label>
	<input type=text id=resultado-nombre required>

	<label for=resultado-peso>Peso</label>
	<input type=number id=resultado-peso maxlength=150 required>

	<div class=acciones-formulario>
		<button type=button id=resultado-guardar >Guardar</button>
		<button type=button id=resultado-cancelar hidden>Cancelar edición</button>
	</div>
</div>

<p id=resultado-mensaje class=mensaje></p>

<table class=tabla>
	<thead>
		<tr>
		<th>Código</th>
		<th>Nombre</th>
		<th>Peso</th>
		<th>Acciones</th>
		</tr>
	</thead>
	<tbody id=resultado-tabla ></tbody>
</table>
