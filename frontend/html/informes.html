	<div class=formulario>
		<label for=informe-estudiante-select>Estudiante</label>
		<select id=informe-estudiante-select required>
			<option value=''>— Seleccionar estudiante —</option>
		</select>

			<button type=button id=informe-generar>Generar informe</button>

	</div>

	<p id=informe-mensaje class=mensaje></p>
</div>
